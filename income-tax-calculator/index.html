<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Income Tax Calculator</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <div id="cnt">
    <h1 id="heading">Income Tax Calculator</h1>

    <!-- 2-Column Grid Layout -->
    <div class="calculator-grid">
      
      <!-- LEFT COLUMN: Form Inputs -->
      <form id="form">
        <h3 class="section-title">📥 Inputs</h3>

        <label for="income">Annual Income (₹)</label>
        <input type="text" id="income" placeholder="e.g. 1000000">

        

        <button id="btn" type="submit">Calculate Tax</button>
      </form>

      <!-- RIGHT COLUMN: Results Card -->
      <div id="result">
        <h3 class="section-title">📊 Results Summary</h3>

        <div class="res-row">
          <span>Gross Income:</span>
          <strong id="gross-income">₹0</strong>
        </div>

        <div class="res-row">
          <span>Tax Rate / Slab:</span>
          <strong id="res-tax-rate">0%</strong>
        </div>

        <hr class="divider">

        <div class="res-row">
          <span>Total Tax Payable:</span>
          <strong id="payable-tax" class="text-danger">₹0</strong>
        </div>

        <div class="res-row">
          <span>Net Take-Home Pay:</span>
          <strong id="take-home" class="text-success">₹0</strong>
        </div>

        <div class="res-row">
          <span>Effective Tax Rate:</span>
          <strong id="eff-tax-rate">0%</strong>
        </div>
      </div>

    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
